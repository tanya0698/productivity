name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24: the api and worker load the shared TypeScript packages with
          # Node's built-in type stripping.
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly what the lockfile pins, for every workspace.
      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w @productivity/api

      # Each step runs even if an earlier one failed, so one push shows every problem.
      - name: Typecheck
        if: '!cancelled()'
        run: npm run typecheck

      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      - name: Test
        if: '!cancelled()'
        run: npm run test

      - name: Build web
        if: '!cancelled()'
        run: npm run build -w @productivity/web

      - name: Build api
        if: '!cancelled()'
        run: npm run build -w @productivity/api
